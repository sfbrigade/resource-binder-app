name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests, build, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches toolchainVendor/toolchainVersion in gradle/gradle-daemon-jvm.properties
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, debug build, lint
        run: >
          ./gradlew
          :sharedLogic:testAndroidHostTest
          :sharedUI:testAndroidHostTest
          :androidApp:assembleDebug
          :androidApp:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

